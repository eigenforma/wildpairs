r: the passage exceeds the encoder's operative window, so the point re-scores one window-full of text</text><text x='30' y='351' font-family='Helvetica,Arial,sans-serif' font-size='10' fill='#5B6169'>and is not a measurement at the length its position names. Seven of ten truncate from 512 up, all-MiniLM-L6-v2 from 256, so inside the</text><text x='30' y='364' font-family='Helvetica,Arial,sans-serif' font-size='10' fill='#5B6169'>deployed-defaults band only the three nomic entries are still measuring length.</text><text x='0' y='381' font-family='Helvetica,Arial,sans-serif' font-size='10' fill='#5B6169'>L*(AUROC=0.75) is left-censored at ≤64 for all ten configurations: none reaches usable discrimination at any length the grid can build.</text></g></svg>