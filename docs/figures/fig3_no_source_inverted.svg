f' font-size='9.5' fill='#5B6169'>n = 132 agreed judgeable · aligned</text><line x1='459.8' y1='88' x2='496.9' y2='88' stroke='#1F6FB2' stroke-width='2' opacity='0.85'/><line x1='459.8' y1='83' x2='459.8' y2='93' stroke='#1F6FB2' stroke-width='2'/><line x1='496.9' y1='83' x2='496.9' y2='93' stroke='#1F6FB2' stroke-width='2'/><circle cx='476.6' cy='88' r='6' fill='#1F6FB2' stroke='#FCFCFB' stroke-width='2'/><text x='508.9' y='92' font-family='Helvetica,Arial,sans-serif' font-size='10' fill='#5B6169'>+0.081</text><text x='0' y='148' font-family='Helvetica,Arial,sans-serif' font-size='11.5' fill='#1A1D21'>IETF bis · working-group revisions</text><text x='0' y='161' font-family='Helvetica,Arial,sans-serif' font-size='9.5' fill='#5B6169'>n = 131 agreed judgeable · aligned</text><line x1='530.3' y1='144' x2='572.9' y2='144' stroke='#1F6FB2' stroke-width='2' opacity='0.85'/><line x1='530.3' y1='139' x2='530.3' y2='149' stroke='#1F6FB2' stroke-width='2'/><line x1='572.9' y1='139' x2='572.9' y2='149' stroke='#1F6FB2' stroke-width='2'/><circle cx='553.2' cy='144' r='6' fill='#1F6FB2' stroke='#FCFCFB' stroke-width='2'/><text x='584.9' y='148' font-family='Helvetica,Arial,sans-serif' font-size='10' fill='#5B6169'>+0.331</text><text x='0' y='204' font-family='Helvetica,Arial,sans-serif' font-size='11.5' fill='#1A1D21'>authored factorial instrument [SGAR]</text><text x='0' y='217' font-family='Helvetica,Arial,sans-serif' font-size='9.5' fill='#5B6169'>n = 62 agreed judgeable · indistinguishable</text><line x1='285.9' y1='200' x2='643.8' y2='200' stroke='#9AA0A6' stroke-width='2' opacity='0.85'/><line x1='285.9' y1='195' x2='285.9' y2='205' stroke='#9AA0A6' stroke-width='2'/><line x1='643.8' y1='195' x2='643.8' y2='205' stroke='#9AA0A6' stroke-width='2'/><circle cx='511.8' cy='200' r='6' fill='#9AA0A6' stroke='#FCFCFB' stroke-width='2'/><text x='655.8' y='204' font-family='Helvetica,Arial,sans-serif' font-size='10' fill='#5B6169'>+0.196</text><text x='0' y='262' font-family='Helvetica,Arial,sans-serif' font-size='10' fill='#5B6169'>On the common support both arms share (token-Jaccard ≥ 0.4, the floor bis alignment imposes and errata never did),</text><text x='0' y='275' font-family='Helvetica,Arial,sans-serif' font-size='10' fill='#5B6169'>errata moves to +0.0525 [0.0015, 0.1133] and bis to +0.3265 [0.252, 0.389] — still disjoint. Two revision processes</text><text x='0' y='288' font-family='Helvetica,Arial,sans-serif' font-size='10' fill='#5B6169'>inside one standards body differ several-fold in coupling magnitude. The authored interval spans both directions and</text><text x='0' y='301' font-family='Helvetica,Arial,sans-serif' font-size='10' fill='#5B6169'>supports no claim about orientation at all.</text></g></svg>